  const mm = Math.floor(Math.ceil(tl) / 60), ss = Math.ceil(tl) % 60;

  text(`Vật ${cur.i + 1}/6 · ${o.name}`, W / 2, 135, 28, '#f3e6d0', 'center', '700');
  // the shadow and its grid
  const shake = cur.t - cur.wrongAt < 0.25 ? Math.sin((cur.t - cur.wrongAt) * 80) * 5 : 0;
  ctx.save(); ctx.translate(shake, 0);
  ctx.drawImage(ARTS[cur.i].sil, BOARD.x, BOARD.y, BOARD.s, BOARD.s);
  const filled = new Set(); for (const p of pz.pieces) if (p.placed && !p.decoy) for (const [r, c] of p.rel) filled.add(K(r + p.sol.r, c + p.sol.c));
  ctx.strokeStyle = 'rgba(255,240,210,0.16)'; ctx.lineWidth = 1.5;
  for (const [r, c] of pz.cells) if (!filled.has(K(r, c))) ctx.strokeRect(BOARD.x + c * bcs + 2, BOARD.y + r * bcs + 2, bcs - 4, bcs - 4);
  const won = cur.wonAt !== null, wonK = won ? Math.min(1, (cur.t - cur.wonAt) / 0.8) : 0;
  if (won) { ctx.fillStyle = rad(ctx, W / 2, BOARD.y + BOARD.s / 2, 10, 380, [[0, `rgba(255,220,140,${0.5 * wonK})`], [1, 'rgba(255,220,140,0)']]); ctx.fillRect(0, BOARD.y - 60, W, BOARD.s + 120); }
  for (const p of pz.pieces) if (p.placed && !p.decoy) drawPieceAt(p, BOARD.x + p.sol.c * bcs, BOARD.y + p.sol.r * bcs, bcs, 1, false);
  if (!won) { // faint seams between placed blocks
    for (const p of pz.pieces) if (p.placed && !p.decoy) { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; for (const [r, c] of p.rel) ctx.strokeRect(BOARD.x + (c + p.sol.c) * bcs, BOARD.y + (r + p.sol.r) * bcs, bcs, bcs); }
  } else for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2 + cur.t * 0.6; sparkle(W / 2 + Math.cos(a) * 270 * wonK, BOARD.y + BOARD.s / 2 + Math.sin(a) * 270 * wonK, 14, wonK * (0.6 + 0.4 * Math.sin(cur.t * 5 + k))); }
  ctx.restore();
  // drag preview
  const d = cur.drag;
  if (d && d.moved) { const t = dropCell(d); ctx.strokeStyle = 'rgba(255,240,200,0.8)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); for (const [r, c] of d.p.rel) ctx.strokeRect(BOARD.x + (c + t.c) * bcs + 3, BOARD.y + (r + t.r) * bcs + 3, bcs - 6, bcs - 6); ctx.setLineDash([]); }
  if (cur.kb && !d && !won && cur.failAt === null) { const p = unplaced()[cur.sel]; if (p) { drawPieceAt(p, BOARD.x + cur.cursor.c * bcs, BOARD.y + cur.cursor.r * bcs, bcs, 0.6, true); } }
  // tray
  if (!won && cur.failAt === null) {
    fillRR(TRAY.x, TRAY.y + 6, TRAY.w, TRAY.h, 34, 'rgba(0,0,0,0.3)'); fillRR(TRAY.x, TRAY.y, TRAY.w, TRAY.h, 34, '#f4ead9'); strokeRR(TRAY.x, TRAY.y, TRAY.w, TRAY.h, 34, C.line, 3);
    const list = unplaced();
    for (const p of pz.pieces) {
      if (p.placed || (d && d.p === p)) continue;
      const sl = cur.tray.slots[p.slot], pos = trayPos(p, cur.tray), sel = cur.kb && list[cur.sel] === p;
      fillRR(sl.x + 5, sl.y + 5, sl.s - 10, sl.s - 10, 16, sel ? '#f9e3b4' : '#ebdcc6');
      if (sel) strokeRR(sl.x + 5, sl.y + 5, sl.s - 10, sl.s - 10, 16, C.gold, 4);
      drawPieceAt(p, pos.x, pos.y, pos.tc, 1, true);
    }
    if (cur.i === 0 && placedCount() === 0 && !d) text('Kéo khối vào đúng chỗ trong bóng đen', W / 2, TRAY.y + 26, 24, C.ink, 'center', '700');
    if (o.decoys && placedCount() === 0 && !d) text(`Cẩn thận: có ${o.decoys} khối không thuộc vật này`, W / 2, TRAY.y + 26, 24, C.red, 'center', '800');
  }
  if (d) { const cs = d.moved ? bcs : d.tc; drawPieceAt(d.p, d.x - d.gx * cs, d.y - d.gy * cs, cs, 0.95, true); }
  // won / failed panels
  if (won) {
    const a = Math.min(1, (cur.t - cur.wonAt) / 0.5); ctx.globalAlpha = a;
    fillRR(70, 830, 580, 400, 40, '#fbf3e6'); strokeRR(70, 830, 580, 400, 40, C.line, 3);
    text('Hoàn thành!', W / 2, 890, 46, C.ink, 'center', '800');
    text(o.name, W / 2, 945, 30, C.inkSoft, 'center', '700');
    const left = Math.ceil(Math.max(0, cur.timeLeft)), stars = left >= timeFor(cur.i) * 0.5 ? 3 : left >= timeFor(cur.i) * 0.2 ? 2 : 1;
    for (let k = 0; k < 3; k++) { const pop = Math.min(1, Math.max(0, (cur.t - cur.wonAt - 0.3 - k * 0.2) / 0.25)); if (pop > 0) drawStar(W / 2 + (k - 1) * 100, 1020, 38 * pop, k < stars ? C.gold : '#d8cbb8'); }
    text(`Còn ${left} giây`, W / 2, 1075, 24, C.inkSoft, 'center', '700');
    if (cur.t - cur.wonAt >= tune.win_delay) drawButton(BTN.cont, 'Về bảo tàng', C.sage, 34);
    ctx.globalAlpha = 1;
  }
  if (cur.failAt !== null) {
    const a = Math.min(1, (cur.t - cur.failAt) / 0.4); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(20,10,20,0.45)'; ctx.fillRect(0, 0, W, H);
    fillRR(70, 820, 580, 420, 40, '#fbf3e6'); strokeRR(70, 820, 580, 420, 40, C.line, 3);
    text('Hết giờ!', W / 2, 885, 52, C.red, 'center', '800');
    text('Ghép lại vật này nhé', W / 2, 945, 28, C.inkSoft, 'center', '700');
    drawButton(BTN.retry, 'Thử lại', C.gold, 36); drawButton(BTN.hub, 'Về bảo tàng', C.cream, 30);
    ctx.globalAlpha = 1;
  }
}
function dropCell(d) { const cur = state.cur; return { r: Math.round((d.y - d.gy * cur.bcs - BOARD.y) / cur.bcs), c: Math.round((d.x - d.gx * cur.bcs - BOARD.x) / cur.bcs) }; }
function dropFloat(d) { const cur = state.cur; return { r: (d.y - d.gy * cur.bcs - BOARD.y) / cur.bcs, c: (d.x - d.gx * cur.bcs - BOARD.x) / cur.bcs }; }

// ---- Pointer ------------------------------------------------------------------------------------
function handlePointer(ev) {
  if (scene !== 'play') { if (ev.k === 'down' && scene === 'title') { reset(); scene = 'play'; } return; }
  if (state.view === 'hub') {
    if (ev.k !== 'down') return;
    if (inBtn(BTN.mute, ev)) { setMuted(!muted); return; }
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && inBtn(BTN.again, ev)) { reset(); } return; }
    for (let i = 0; i < OBJECTS.length; i++) { const s = SLOT(i); if (ev.x >= s.x && ev.x <= s.x + s.s && ev.y >= s.y && ev.y <= s.y + s.s + 90 && !state.done[i]) { state.kbHub = false; openObject(i); return; } }
    return;
  }
  const cur = state.cur;
  if (ev.k === 'down') {
    if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && inBtn(BTN.cont, ev)) backToHub(); return; }
    if (cur.failAt !== null) { if (inBtn(BTN.retry, ev)) openObject(cur.i); else if (inBtn(BTN.hub, ev)) backToHub(); return; }
    if (inBtn(BTN.back, ev)) { backToHub(); return; }
    if (inBtn(BTN.hint, ev)) { useHint(); return; }
    cur.kb = false;
    for (const p of cur.pz.pieces) {
      if (p.placed) continue; const sl = cur.tray.slots[p.slot];
      if (ev.x >= sl.x && ev.x <= sl.x + sl.s && ev.y >= sl.y && ev.y <= sl.y + sl.s) {
        const pos = trayPos(p, cur.tray);
        cur.drag = { p, sx: ev.x, sy: ev.y, x: ev.x, y: ev.y, tc: pos.tc, gx: Math.max(0, Math.min(p.w - 0.01, (ev.x - pos.x) / pos.tc)), gy: Math.max(0, Math.min(p.h - 0.01, (ev.y - pos.y) / pos.tc)), moved: false };
        sfx.pick(); return;
      }
    }
  } else if (ev.k === 'move' && cur.drag) {
    const d = cur.drag; d.x = ev.x; d.y = ev.y; if (Math.hypot(d.x - d.sx, d.y - d.sy) > tune.tap_slop) d.moved = true;
  } else if (ev.k === 'up' && cur.drag) {
    const d = cur.drag; cur.drag = null;
    if (!d.moved || cur.failAt !== null) return;
    const f = dropFloat(d);
    if (f.r < -1.5 || f.c < -1.5 || f.r > OBJECTS[cur.i].grid + 0.5 || f.c > OBJECTS[cur.i].grid + 0.5) { sfx.pick(); return; } // dropped off the shadow: back to the tray quietly
    tryDrop(d.p, f.r, f.c);
  }
}

// ---- Keyboard ------------------------------------------------------------------------------------
function keyboard() {
  if (state.view === 'hub') {
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && pressed('Enter')) reset(); return; }
    const todo = OBJECTS.map((_, i) => i).filter(i => !state.done[i]);
    const mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2 };
    for (const k in mv) if (pressed(k)) { state.kbHub = true; state.sel = (state.sel + mv[k] + 6) % 6; }
    if (pressed('Enter') || pressed('Space')) { const i = state.kbHub && !state.done[state.sel] ? state.sel : todo[0]; if (i !== undefined) openObject(i); }
    return;
  }
  const cur = state.cur;
  if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && (pressed('Enter') || pressed('Space'))) backToHub(); return; }
  if (cur.failAt !== null) { if (pressed('Enter') || pressed('Space')) openObject(cur.i); if (pressed('Escape')) backToHub(); return; }
  if (pressed('Escape')) { backToHub(); return; }
  if (pressed('KeyH')) useHint();
  const list = unplaced(); if (!list.length) return;
  if (cur.sel >= list.length) cur.sel = 0;
  if (pressed('KeyE') || pressed('Tab')) { cur.sel = (cur.sel + 1) % list.length; cur.kb = true; }
  if (pressed('KeyQ')) { cur.sel = (cur.sel - 1 + list.length) % list.length; cur.kb = true; }
  const n = OBJECTS[cur.i].grid;
  for (const [k, dr, dc] of [['ArrowLeft', 0, -1], ['ArrowRight', 0, 1], ['ArrowUp', -1, 0], ['ArrowDown', 1, 0]]) if (pressed(k)) { cur.kb = true; cur.cursor.r = Math.max(0, Math.min(n - 1, cur.cursor.r + dr)); cur.cursor.c = Math.max(0, Math.min(n - 1, cur.cursor.c + dc)); }
  if (cur.kb && pressed('Space')) tryDrop(list[cur.sel], cur.cursor.r, cur.cursor.c);
}

// ---- Scenes ---------------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      drawHall(0); text('Hiện vật', W / 2, 60, 40, C.ink, 'center', '800');
      OBJECTS.forEach((o, i) => { const x = 40 + (i % 2) * 340, y = 110 + Math.floor(i / 2) * 330; ctx.drawImage(ARTS[i].img, x + 20, y, 260, 260); text(o.name, x + 150, y + 280, 24, C.ink); });
      drawVisitor(360, 1150, 1.6, '#5f9fd6', '#3d2a20', state.t * 6); text('Khách tham quan', 360, 1240, 22, C.ink);
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      drawHall(0.3);
      text('Shadow', W / 2, 150, 88, C.ink, 'center', '800'); text('Museum', W / 2, 240, 88, C.ink, 'center', '800');
      text('Ghép khối để hiện vật thể', W / 2, 310, 30, C.inkSoft, 'center', '700');
      const sw = 200 + Math.sin(state.t * 1.4) * 4;
      ctx.drawImage(ARTS[0].sil, 110, 370, sw, sw); ctx.drawImage(ARTS[0].img, 410, 370, 200, 200);
      ctx.save(); ctx.beginPath(); ctx.moveTo(320, 470); ctx.lineTo(400, 470); stroke(ctx, C.inkSoft, 6); ctx.beginPath(); ctx.moveTo(385, 455); ctx.lineTo(400, 470); ctx.lineTo(385, 485); stroke(ctx, C.inkSoft, 6); ctx.restore();
      drawPedestal(130, 566, 160, false); drawPedestal(430, 566, 160, true);
      CONTROLS.forEach((c, i) => text(c, W / 2, 760 + i * 52, 26, C.ink, 'center', '600'));
      drawButton(BTN.start, 'Vào bảo tàng', C.gold, 36);
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      while (ptrQ.length) handlePointer(ptrQ.shift());
      keyboard();
      if (state.view === 'puzzle' && state.cur) {
        const cur = state.cur; cur.t += dt;
        if (cur.wonAt === null && cur.failAt === null) {
          cur.timeLeft -= dt;
          const sec = Math.ceil(cur.timeLeft);
          if (sec <= tune.warn_time && sec < cur.lastTick && sec > 0) sfx.tick();
          cur.lastTick = sec;
          if (cur.timeLeft <= 0) failObject();
        }
      }
      for (const v of state.visitors) { v.x += v.v * dt; if (v.x > W + 60) v.x = -60; }
    },
    draw() { if (state.view === 'hub') drawHub(); else drawPuzzle(); },
  },
};

// ---- Loop -----------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (scene !== 'play') { for (const ev of ptrQ) handlePointer(ev); ptrQ.length = 0; }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() { const now = clock.now(); acc += Math.min(now - last, 0.25); last = now; while (acc >= STEP) { step(); acc -= STEP; } ALPHA = acc / STEP; drawFrame(); }
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
