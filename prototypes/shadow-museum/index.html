  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);

  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();

  if (!audio) {

}

function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!audio || muted) return;

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));

  ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
}
function sparkle(x, y, r, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fff6d0';

  for (let k = 0; k < 18; k++) { const bx = (k * 53) % 760 - 20, y0 = TY + 40 + (k * 97) % 1000; ctx.beginPath(); ctx.moveTo(tx(bx, y0), y0); ctx.quadraticCurveTo(tx(bx + 8, y0 + 60), y0 + 60, tx(bx, y0 + 120), y0 + 120); stroke(ctx, 'rgba(255,210,160,0.06)', 2); }

  const x = BOARD.x - 14, y = BOARD.y - 14, w = BOARD.s + 28, h = BOARD.s + 28, d = 12;

// ---- Pointer ------------------------------------------------------------------------------------
function handlePointer(ev) {
  if (scene !== 'play') { if (ev.k === 'down' && scene === 'title') { reset(); scene = 'play'; } return; }
  if (state.view === 'hub') {
    if (ev.k !== 'down') return;
    if (inBtn(BTN.mute, ev)) { setMuted(!muted); return; }
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && inBtn(BTN.play, ev)) goNextArea(); return; }
    if (inBtn(BTN.play, ev)) { const i = nextObject(); if (i >= 0) { state.kbHub = false; openObject(i); } return; }
    for (const i of areaObjects(state.area).sort((a, b) => spotOf(b).y - spotOf(a).y)) { const sp = spotOf(i); if (!state.done[i] && Math.abs(ev.x - sp.x) <= sp.s / 2 && ev.y >= sp.y - sp.s && ev.y <= sp.y + 40) { state.kbHub = false; openObject(i); return; } } // front first
    return;
  }
  const cur = state.cur;
  if (ev.k === 'down') {
    if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && inBtn(BTN.cont, ev)) backToHub(); return; }
    if (cur.failAt !== null) { if (cur.t - cur.failAt > 0.4) { if (inBtn(BTN.retry, ev)) openObject(cur.i); else if (inBtn(BTN.hub, ev)) backToHub(); } return; }
    if (inBtn(BTN.back, ev)) { backToHub(); return; }
    if (inBtn(BTN.hint, ev)) { useHint(); return; }
    cur.kb = false;
    for (const p of cur.pz.pieces) {
      if (p.placed) continue; const sl = cur.tray.slots[p.slot];
      if (ev.x >= sl.x && ev.x <= sl.x + sl.s && ev.y >= sl.y && ev.y <= sl.y + sl.s) { cur.drag = { p, sx: ev.x, sy: ev.y, x: ev.x, y: ev.y, moved: false }; sfx.pick(); return; }
    }
  } else if (ev.k === 'move' && cur.drag) {
    const d = cur.drag; d.x = ev.x; d.y = ev.y; if (Math.hypot(d.x - d.sx, d.y - d.sy) > tune.tap_slop) d.moved = true;
  } else if (ev.k === 'up' && cur.drag) {
    const d = cur.drag; cur.drag = null;
    if (!d.moved || cur.wonAt !== null || cur.failAt !== null) return;
    const q = dragPos(d), mx = q.x + d.p.part.w * BS / 2, my = q.y + d.p.part.h * BS / 2;
    if (mx < BOARD.x - 40 || mx > BOARD.x + BOARD.s + 40 || my < BOARD.y - 40 || my > BOARD.y + BOARD.s + 10) { sfx.pick(); return; } // let go off the shadow: back to the tray quietly
    tryDrop(d.p, q.x, q.y);
  }
}

// ---- Keyboard ------------------------------------------------------------------------------------
function keyboard(dt) {
  if (state.view === 'hub') {
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && pressed('Enter')) goNextArea(); return; }
    const ids = areaObjects(state.area), mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 1, ArrowUp: -1 };
    if (!ids.includes(state.sel)) state.sel = ids[0];
    for (const k in mv) if (pressed(k)) { state.kbHub = true; state.sel = ids[(ids.indexOf(state.sel) + mv[k] + ids.length) % ids.length]; }
    if (pressed('Enter') || pressed('Space')) { const i = state.kbHub && !state.done[state.sel] ? state.sel : nextObject(); if (i >= 0) openObject(i); }
    return;
  }
  const cur = state.cur;
  if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && (pressed('Enter') || pressed('Space'))) backToHub(); return; }
  if (cur.failAt !== null) { if (cur.t - cur.failAt > 0.4) { if (pressed('Enter') || pressed('Space')) openObject(cur.i); else if (pressed('Escape')) backToHub(); } return; }
  if (pressed('Escape')) { backToHub(); return; }
  if (pressed('KeyH')) useHint();
  if (cur.wonAt !== null) return;
  const list = unplaced(); if (!list.length) return;
  if (cur.sel >= list.length) cur.sel = 0;
  if (pressed('KeyE') || pressed('Tab')) { cur.sel = (cur.sel + 1) % list.length; cur.kb = true; }
  if (pressed('KeyQ')) { cur.sel = (cur.sel - 1 + list.length) % list.length; cur.kb = true; }
  for (const [k, dx, dy] of [['ArrowLeft', -1, 0], ['ArrowRight', 1, 0], ['ArrowUp', 0, -1], ['ArrowDown', 0, 1]]) if (down.has(k) || pressed(k)) {
    cur.kb = true;
    cur.cursor.x = Math.max(BOARD.x, Math.min(BOARD.x + BOARD.s, cur.cursor.x + dx * tune.key_speed * dt));
    cur.cursor.y = Math.max(BOARD.y, Math.min(BOARD.y + BOARD.s, cur.cursor.y + dy * tune.key_speed * dt));
  }
  if (cur.kb && pressed('Space')) { const p = list[cur.sel]; tryDrop(p, cur.cursor.x - p.part.w * BS / 2, cur.cursor.y - p.part.h * BS / 2); }
}

    update(dt) { state.t += dt; },
    draw() {
      drawHall(0); ctx.fillStyle = 'rgba(248,238,222,0.8)'; ctx.fillRect(0, 0, W, H); text('Hiện vật', W / 2, 60, 40, C.ink, 'center', '800');
      OBJECTS.forEach((o, i) => { const x = 10 + (i % 3) * 236, y = 96 + Math.floor(i / 3) * 196, tk = ARTS[i].thick, s = 160; ctx.drawImage(tk, x + 38, y, tk.width * s / ART_N, tk.height * s / ART_N); text(o.name, x + 118, y + 172, 18, C.ink); });
      drawVisitor(640, 1250, 0.6, '#5f9fd6', '#3d2a20', state.t * 6);
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      drawHall(0.3, 6); ctx.fillStyle = 'rgba(248,238,222,0.78)'; ctx.fillRect(0, 0, W, H);
      text('Shadow', W / 2, 150, 88, C.ink, 'center', '800'); text('Museum', W / 2, 240, 88, C.ink, 'center', '800');
      text('Ghép bộ phận để hiện vật thể', W / 2, 310, 30, C.inkSoft, 'center', '700');
      const sw = 200 + Math.sin(state.t * 1.4) * 4;
      ctx.drawImage(ARTS[0].sil, 110, 370, sw, sw); { const tk = ARTS[0].thick; ctx.drawImage(tk, 410, 370, tk.width * 200 / ART_N, tk.height * 200 / ART_N); }
      ctx.save(); ctx.beginPath(); ctx.moveTo(320, 470); ctx.lineTo(400, 470); stroke(ctx, C.inkSoft, 6); ctx.beginPath(); ctx.moveTo(385, 455); ctx.lineTo(400, 470); ctx.lineTo(385, 485); stroke(ctx, C.inkSoft, 6); ctx.restore();
      drawPedestal(130, 566, 160, false); drawPedestal(430, 566, 160, true);
      CONTROLS.forEach((c, i) => text(c, W / 2, 760 + i * 52, 26, C.ink, 'center', '600'));
      drawButton(BTN.start, 'Vào bảo tàng', C.gold, 36);
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      while (ptrQ.length) handlePointer(ptrQ.shift());
      keyboard(dt);
      if (state.view === 'puzzle' && state.cur) { state.cur.t += dt; runClock(dt); }
      for (const v of state.visitors) { v.x += v.v * dt; if (v.x > W + 60) v.x = -60; }
    },
    draw() { if (state.view === 'hub') drawHub(); else drawPuzzle(); },
  },
};

// ---- Loop -----------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (scene !== 'play') { for (const ev of ptrQ) handlePointer(ev); ptrQ.length = 0; }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() { const now = clock.now(); acc += Math.min(now - last, 0.25); last = now; while (acc >= STEP) { step(); acc -= STEP; } ALPHA = acc / STEP; drawFrame(); }
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
