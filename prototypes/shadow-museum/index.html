  if (!audio) {

function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0) {

}

function rr(g, x, y, w, h, r) {

function fillRR(x, y, w, h, r, c) { rr(ctx, x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function strokeRR(x, y, w, h, r, c, lw) { rr(ctx, x, y, w, h, r); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke(); }

}

}

function handlePointer(ev) {

    if (ev.k !== 'down') return;
    if (inBtn(BTN.mute, ev)) { tapFx('mute'); setMuted(!muted); return; }
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && inBtn(BTN.play, ev)) { tapFx('play'); goNextArea(); } return; }
    if (inBtn(BTN.play, ev)) { tapFx('play'); const i = nextObject(); if (i >= 0) { state.kbHub = false; openObject(i); } return; }

    if (i < 0) for (const k of areaObjects(state.area)) { const m = ui.marks[k]; if (m && ev.x >= m.x0 && ev.x <= m.x1 && ev.y >= m.y0 && ev.y <= m.y1) i = k; }
    if (i >= 0 && !state.done[i] && OBJECTS[i].area === state.area) { state.kbHub = false; openObject(i); }
    return;
  }
  const cur = state.cur;
  if (cur.wonAt !== null) { // finished: a sideways drag turns the 3D object round
    if (ev.k === 'down') { if (cur.t - cur.wonAt >= tune.win_delay && inBtn(BTN.cont, ev)) { tapFx('cont'); backToHub(); return; } cur.spinAt = ev.x; }
    else if (ev.k === 'move' && cur.spinAt !== undefined && cur.spinAt !== null) { cur.spin = (cur.spin || 0) + (ev.x - cur.spinAt) * 0.012; cur.spinAt = ev.x; }

    return;
  }
  if (ev.k === 'down') {
    if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && inBtn(BTN.cont, ev)) { tapFx('cont'); backToHub(); } return; }
    if (cur.failAt !== null) { if (cur.t - cur.failAt > 0.4) { if (inBtn(BTN.retry, ev)) { tapFx('retry'); openObject(cur.i); } else if (inBtn(BTN.hub, ev)) { tapFx('hub'); backToHub(); } } return; }
    if (inBtn(BTN.back, ev)) { tapFx('back'); backToHub(); return; }
    if (inBtn(BTN.freeze, ev)) { tapFx('freeze'); useFreeze(); return; }
    if (inBtn(BTN.magnet, ev)) { tapFx('magnet'); useHint(); return; }
    cur.kb = false;
    if (inTray(ev)) {
      const list = unplaced(), idx = Math.floor((ev.x - trayX0()) / TRAY3.pitch + cur.scroll + 1e-6), p = idx >= Math.floor(cur.scroll + 1e-6) && idx < cur.scroll + TRAY3.n ? list[idx] : null;
      cur.drag = { p, sx: ev.x, sy: ev.y, x: ev.x, y: ev.y, moved: false, mode: null, scroll0: cur.scroll, pos: null };
      if (p) sfx.pick();
    }
  } else if (ev.k === 'move' && cur.drag) {
    const d = cur.drag; d.x = ev.x; d.y = ev.y;
    const dx = d.x - d.sx, dy = d.y - d.sy;
    if (!d.mode && Math.hypot(dx, dy) > tune.tap_slop) d.mode = !d.p || Math.abs(dx) > Math.abs(dy) * 1.2 ? 'scroll' : 'piece';
    if (d.mode === 'scroll') cur.scroll = Math.max(-0.4, Math.min(scrollMax() + 0.4, d.scroll0 - dx / TRAY3.pitch));
    if (d.mode === 'piece') { d.moved = true; d.pos = G3.screenToBoard(d.x, d.y - tune.drag_lift); }
  } else if (ev.k === 'up' && cur.drag) {
    const d = cur.drag; cur.drag = null;
    if (d.mode === 'scroll') { const v = (d.scroll0 - (ev.x - d.sx) / TRAY3.pitch); cur.scroll = Math.max(0, Math.min(scrollMax(), Math.round(v))); sfx.pick(); return; }
    if (!d.moved || cur.wonAt !== null || cur.failAt !== null) return;
    const q = G3.screenToBoard(ev.x, ev.y - tune.drag_lift);
    if (inTray(ev) || !q || Math.hypot(q.x - BOARD.s / 2, q.y - BOARD.s / 2) > BOARD.s * 0.7) { sfx.pick(); return; } // let go off the board: back to the tray quietly
    tryDrop(d.p, q.x - d.p.part.w * BS / 2, q.y - d.p.part.h * BS / 2);
  }
}

// ---- Keyboard ------------------------------------------------------------------------------------
function keyboard(dt) {
  if (state.view === 'hub') {
    if (state.openAt !== null) { if (state.t - state.openAt > 1.5 && pressed('Enter')) goNextArea(); return; }
    const ids = areaObjects(state.area), mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 1, ArrowUp: -1 };
    if (!ids.includes(state.sel)) state.sel = ids[0];
    for (const k in mv) if (pressed(k)) { state.kbHub = true; state.sel = ids[(ids.indexOf(state.sel) + mv[k] + ids.length) % ids.length]; }
    if (pressed('Enter') || pressed('Space')) { const i = state.kbHub && !state.done[state.sel] ? state.sel : nextObject(); if (i >= 0) openObject(i); }
    return;
  }
  const cur = state.cur;
  if (cur.wonAt !== null) { if (cur.t - cur.wonAt >= tune.win_delay && (pressed('Enter') || pressed('Space'))) backToHub(); return; }
  if (cur.failAt !== null) { if (cur.t - cur.failAt > 0.4) { if (pressed('Enter') || pressed('Space')) openObject(cur.i); else if (pressed('Escape')) backToHub(); } return; }
  if (pressed('Escape')) { backToHub(); return; }
  if (pressed('KeyH')) useHint();
  if (pressed('KeyF')) useFreeze();
  if (cur.wonAt !== null) return;
  const list = unplaced(); if (!list.length) return;
  if (cur.sel >= list.length) cur.sel = 0;
  if (pressed('KeyE') || pressed('Tab')) { cur.sel = (cur.sel + 1) % list.length; cur.kb = true; }
  if (pressed('KeyQ')) { cur.sel = (cur.sel - 1 + list.length) % list.length; cur.kb = true; }
  if (cur.kb) { if (cur.sel < cur.scroll) cur.scroll = cur.sel; if (cur.sel >= cur.scroll + TRAY3.n) cur.scroll = cur.sel - TRAY3.n + 1; } // keep the chosen piece in sight
  for (const [k, dx, dy] of [['ArrowLeft', -1, 0], ['ArrowRight', 1, 0], ['ArrowUp', 0, -1], ['ArrowDown', 0, 1]]) if (down.has(k) || pressed(k)) {
    cur.kb = true;
    cur.cursor.x = Math.max(0, Math.min(BOARD.s, cur.cursor.x + dx * tune.key_speed * dt));
    cur.cursor.y = Math.max(0, Math.min(BOARD.s, cur.cursor.y + dy * tune.key_speed * dt));
  }
  if (cur.kb && pressed('Space')) { const p = list[cur.sel]; tryDrop(p, cur.cursor.x - p.part.w * BS / 2, cur.cursor.y - p.part.h * BS / 2); }
}

// ---- Scenes ---------------------------------------------------------------------------------------
const scenes = {
  cuts: { // every cut style on one object, pieces pulled a little apart, for choosing styles
    update(dt) { state.t += dt; },
    draw() {
      clear('#efe3cf'); text('Các kiểu cắt', W / 2, 44, 38, C.ink, 'center', '800');
      if (!CUT_GALLERY) {
        const i = Math.max(0, OBJECTS.findIndex(o => o.art === (params.get('art') || 'globe'))), img = ARTS[i].img;
        CUT_GALLERY = [['mosaic', 'Khảm ngẫu nhiên'], ['amoeba', 'Hữu cơ'], ['swirl', 'Cuộn xoắn'], ['ribbon', 'Dải lượn'], ['fan', 'Hình quạt'], ['kinked', 'Gấp khúc'], ['wave', 'Lượn sóng'], ['mixed+', 'Trộn + con vật']].map(([style, name], k) => {
          seed = 1000 + k * 17;
          const o = style === 'mixed+' ? { style: 'mixed', cols: 3, rows: 3, whimsy: 2 } : { style, pieces: 9, cols: 3, rows: 3 };
          const parts = LABEL_STYLES.includes(style) ? labelCut(img, o, style) : jigsawCut(img, o);
          for (const p of parts) p.tc = thicken(p.cv, tune.piece_depth);
          return { name, parts };
        });
      }
      CUT_GALLERY.forEach((g, k) => {
        const col = k % 2, row = Math.floor(k / 2), bx = 30 + col * 340, by = 80 + row * 298, sc = 0.46;
        fillRR(bx, by, 320, 282, 20, '#fbf6ee'); strokeRR(bx, by, 320, 282, 20, C.line, 2);
        for (const p of g.parts) { const pcx = p.x + p.w / 2 - 240, pcy = p.y + p.h / 2 - 240; ctx.drawImage(p.tc, bx + 160 - 240 * sc + (p.x + pcx * 0.14) * sc, by + 118 - 240 * sc + (p.y + pcy * 0.14) * sc, p.tc.width * sc, p.tc.height * sc); }
        text(`${g.name} · ${g.parts.length} mảnh`, bx + 160, by + 262, 20, C.ink, 'center', '700');
      });
    },
  },
  figures: { // every object as its 3D toy, each named
    update(dt) { state.t += dt; },
    draw() {
      const labels = G3.renderFigures(state.t);
      outText('Hiện vật', W / 2, 56, 44, '#fff', '#3a2357');
      for (const l of labels) text(OBJECTS[l.i].name, l.x, l.y, 20, C.ink, 'center', '800');
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw(dt) {
      G3.renderHub(0, { done: OBJECTS.map(() => true), lit: 0.6, t: state.t, next: -1, visitors: [], since: state.t }, dt);
      ctx.fillStyle = lin(ctx, 0, 0, 0, H, [[0, 'rgba(30,18,50,0.65)'], [0.35, 'rgba(30,18,50,0.15)'], [0.7, 'rgba(30,18,50,0.2)'], [1, 'rgba(30,18,50,0.8)']]); ctx.fillRect(0, 0, W, H);
      const k1 = easeOutBack(state.t / 0.6), k2 = easeOutBack((state.t - 0.15) / 0.6);
      ctx.save(); scaleAbout(W / 2, 150, k1); outText('Shadow', W / 2, 150 + Math.sin(state.t * 2) * 4, 104, '#fff', '#5a35ab'); ctx.restore();
      ctx.save(); scaleAbout(W / 2, 255, k2); outText('Pieces', W / 2, 255 + Math.sin(state.t * 2 + 1) * 4, 104, PAL.gold[0], '#5a35ab'); ctx.restore();
      outText('Ghép mảnh vào bóng đen để vật hiện ra', W / 2, 340, 28, '#fff', '#3a2357', '800');
      fillRR(40, 800, 640, 250, 30, 'rgba(30,18,50,0.6)'); strokeRR(40, 800, 640, 250, 30, 'rgba(255,255,255,0.5)', 3);
      CONTROLS.forEach((c, i) => text(c, W / 2, 836 + i * 44, 21, '#fff8ec', 'center', '700'));
      drawButton(BTN.start, 'Vào bảo tàng', PAL.green, 40, 'start', 0.03 * Math.sin(state.t * 4));
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      while (ptrQ.length) handlePointer(ptrQ.shift());
      keyboard(dt);
      const cur = state.cur;
      if (state.view === 'puzzle' && cur) {
        cur.t += dt; runClock(dt);
        if (!(cur.drag && cur.drag.mode === 'scroll')) { const m = scrollMax(); if (cur.scroll > m) cur.scroll = m; if (cur.scroll < 0) cur.scroll = 0; }
      }
      for (const v of state.visitors) { v.x += v.v * dt; if (v.x > W + 60) v.x = -60; }
    },
    draw(dt) { if (state.view === 'hub') drawHub(dt); else drawPuzzle(dt); },
  },
};

// ---- Loop -----------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (scene !== 'play') { for (const ev of ptrQ) handlePointer(ev); ptrQ.length = 0; }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() { const now = clock.now(); acc += Math.min(now - last, 0.25); last = now; while (acc >= STEP) { step(); acc -= STEP; } ALPHA = acc / STEP; drawFrame(); }
// Each frame: the scene draws its 3D world and its HUD; a change of screen opens with a round reveal.
let viewKey = '', irisAt = -9, lastDraw = null;
function drawFrame() {
  const now = clock.now(), dt = lastDraw === null ? STEP : Math.min(0.05, Math.max(0, now - lastDraw)); lastDraw = now;
  ctx.clearRect(0, 0, W, H);
  const key = scene + '|' + (state.view || '') + state.area;
  if (key !== viewKey) { if (viewKey) irisAt = now; viewKey = key; }
  scenes[scene].draw(dt || STEP);
  const u = (now - irisAt) / 0.55;
  if (u < 1) { const r = easeOut(u) * 820; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H * 0.48, Math.max(0.1, r), 0, Math.PI * 2); ctx.fillStyle = '#2b2140'; ctx.fill('evenodd'); }
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

G3.init(glCanvas); fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
